<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 爆破物理实验 · 60 层砖塔</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1a2a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px; width: 234px;
    background: rgba(10, 18, 32, .82); border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 14px 16px; color: #e6f0ff;
    backdrop-filter: blur(6px); z-index: 10; user-select: none;
  }
  #ui h2 { font-size: 15px; margin-bottom: 10px; letter-spacing: 1px; }
  #ui .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9fb6d4; margin: 4px 0; }
  #energy { width: 100%; accent-color: #ff8c3a; }
  .btn { width: 100%; margin-top: 8px; padding: 9px 0; border: none; border-radius: 8px; font-size: 14px; color: #fff; cursor: pointer; transition: .15s; }
  #boomBtn { background: linear-gradient(135deg, #ff6a2b, #d93a1f); }
  #boomBtn:disabled { background: #3a4658; color: #7d8ca3; cursor: not-allowed; }
  #resetBtn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); }
  #boomBtn:hover:not(:disabled) { filter: brightness(1.15); }
  #resetBtn:hover { background: rgba(255,255,255,.2); }
  #ui .sep { border-top: 1px solid rgba(255,255,255,.12); margin: 12px 0 8px; }
  .camGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .camBtn { padding: 7px 0; font-size: 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #cfe0f5; cursor: pointer; }
  .camBtn:hover { background: rgba(255,255,255,.16); }
  .camBtn.active { background: #ff8c3a; border-color: #ff8c3a; color: #fff; }
  #status { margin-top: 10px; font-size: 12px; color: #8fd9a0; line-height: 1.5; }
  #hint { margin-top: 6px; font-size: 11px; color: #7f96b5; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .5s; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b1a2a; color: #cfe0f5; font-size: 15px; z-index: 30; letter-spacing: 2px;
  }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0b1a2a; color: #ff8f8f; font-size: 14px; z-index: 40; line-height: 2; text-align: center; padding: 20px; }
  #hud {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(230,240,255,.6); background: rgba(10,18,32,.55);
    padding: 6px 14px; border-radius: 20px; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="loading">正在加载 3D 物理引擎…</div>
<div id="err">加载失败:请检查网络连接(需要访问 CDN 加载 Three.js 与 Rapier 物理引擎)</div>
<div id="ui">
  <h2>3D 爆破物理实验</h2>
  <div class="row"><span>爆炸能量</span><span id="eVal">60</span></div>
  <input type="range" id="energy" min="0" max="100" value="60" step="1">
  <button class="btn" id="boomBtn" disabled>爆 破</button>
  <button class="btn" id="resetBtn">重 置</button>
  <div class="sep"></div>
  <div class="camGrid">
    <button class="camBtn active" data-cam="front">正面全景</button>
    <button class="camBtn" data-cam="top">俯视鸟瞰</button>
    <button class="camBtn" data-cam="blast">爆破点特写</button>
  </div>
  <div id="status">搭建中…</div>
  <div id="hint">爆破后点击砖块可将其推飞</div>
</div>
<div id="hud">左键拖动旋转视角 · 滚轮缩放</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import RAPIER from '@dimforge/rapier3d-compat';

const errEl = document.getElementById('err');
window.addEventListener('error', () => { errEl.style.display = 'flex'; });

const loadingEl = document.getElementById('loading');
const flashEl = document.getElementById('flash');
const energySlider = document.getElementById('energy');
const eValEl = document.getElementById('eVal');
const boomBtn = document.getElementById('boomBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

const LAYERS = 60, PER_LAYER = 18;
const R = 3.4, BH = 0.4, BD = 0.55;
const tang = 2 * Math.PI / PER_LAYER;
const BW = R * tang * 0.97;
const TOTAL = LAYERS * PER_LAYER;
const BLAST_Y = 8;
const MAX_PARTS = 4;
const FRACTURE_T = 650;
const CRASH_SPEED = 7;
const MAX_CRUSH_PER_FRAME = 50;

let world;
let bricksMesh, debrisMesh;
const tmpObj = new THREE.Object3D();
let exploded = false;
let stabilized = false;
let settleTimer = 0;
let blocks = [];
const colliderOwner = new Map();
let blocksBroken = 0;
const crushQueue = new Map();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb6dd);
scene.fog = new THREE.Fog(0x8fb6dd, 90, 230);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.02;
controls.maxDistance = 160;

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x5a6b52, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(35, 55, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(80, 64),
  new THREE.MeshStandardMaterial({ color: 0x7d8471, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(80, 40, 0x5c6b5a, 0x66796a);
grid.position.y = 0.02;
scene.add(grid);

const smokeTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

const SMOKE_N = 300;
const smokePos = new Float32Array(SMOKE_N * 3);
const smokeVel = new Float32Array(SMOKE_N * 3);
const smokeLife = new Float32Array(SMOKE_N);
const smokeMaxLife = new Float32Array(SMOKE_N);
const smokeSize = new Float32Array(SMOKE_N);
const smokeAlpha = new Float32Array(SMOKE_N);
const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(smokeSize, 1));
smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(smokeAlpha, 1));
const smokeMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uTex: { value: smokeTex } },
  vertexShader: `
    attribute float aSize;
    attribute float aAlpha;
    varying float vA;
    void main() {
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (260.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vA;
    void main() {
      vec4 tex = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(0.62, 0.60, 0.58, tex.a * vA);
    }`
});
const smoke = new THREE.Points(smokeGeo, smokeMat);
smoke.frustumCulled = false;
smoke.visible = false;
scene.add(smoke);

const shockMat = new THREE.MeshBasicMaterial({
  color: 0xfff5e0, transparent: true, opacity: 0,
  depthWrite: false, side: THREE.BackSide
});
const shock = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), shockMat);
scene.add(shock);
let shockT = -1;

const flashLight = new THREE.PointLight(0xffc98a, 0, 90, 1.8);
flashLight.position.set(0, BLAST_Y, 0);
scene.add(flashLight);

const SPARK_N = 420;
const sparkGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffc98a });
const sparkMesh = new THREE.InstancedMesh(sparkGeo, sparkMat, SPARK_N);
sparkMesh.frustumCulled = false;
scene.add(sparkMesh);
const tmpSpark = new THREE.Object3D();
const sparks = [];
for (let i = 0; i < SPARK_N; i++) {
  sparks.push({ alive: false, px: 0, py: 0, pz: 0, vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0, rvx: 0, rvy: 0, rvz: 0, life: 0 });
}

function spawnSparks(energy) {
  const n = Math.round(SPARK_N * (0.45 + energy * 0.55));
  for (let i = 0; i < n; i++) {
    const s = sparks[i];
    s.alive = true;
    const a = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    const sp = (4 + energy * 22) * (0.5 + Math.random() * 0.8);
    s.vx = Math.sin(v) * Math.cos(a) * sp;
    s.vy = Math.sin(v) * Math.sin(a) * sp * 0.7 + 3;
    s.vz = Math.cos(v) * sp;
    s.px = 0; s.py = BLAST_Y; s.pz = 0;
    s.rx = Math.random() * 6.28; s.ry = Math.random() * 6.28; s.rz = 0;
    s.rvx = (Math.random() - 0.5) * 14;
    s.rvy = (Math.random() - 0.5) * 14;
    s.rvz = (Math.random() - 0.5) * 14;
    s.life = 1.2 + Math.random() * 1.3;
  }
  for (let i = n; i < SPARK_N; i++) sparks[i].alive = false;
  sparkMesh.count = n;
}

function updateSparks(dt) {
  let any = false;
  for (let i = 0; i < sparkMesh.count; i++) {
    const s = sparks[i];
    if (!s.alive) continue;
    any = true;
    s.life -= dt;
    if (s.life <= 0) { s.alive = false; continue; }
    s.vy -= 9.8 * dt * 0.35;
    s.px += s.vx * dt; s.py += s.vy * dt; s.pz += s.vz * dt;
    if (s.py < 0.06) { s.py = 0.06; s.vy *= -0.3; s.vx *= 0.7; s.vz *= 0.7; }
    s.rx += s.rvx * dt; s.ry += s.rvy * dt; s.rz += s.rvz * dt;
    const sc = Math.max(0.05, s.life * 0.6);
    tmpSpark.position.set(s.px, s.py, s.pz);
    tmpSpark.rotation.set(s.rx, s.ry, s.rz);
    tmpSpark.scale.set(sc, sc, sc);
    tmpSpark.updateMatrix();
    sparkMesh.setMatrixAt(i, tmpSpark.matrix);
  }
  sparkMesh.instanceMatrix.needsUpdate = true;
  if (!any) sparkMesh.count = 0;
}

await RAPIER.init();
loadingEl.style.display = 'none';

world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
const eventQueue = new RAPIER.EventQueue(false);
const groundBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
world.createCollider(
  RAPIER.ColliderDesc.cuboid(80, 1, 80).setFriction(0.9).setRestitution(0.05),
  groundBody
);

const brickGeo = new THREE.BoxGeometry(BW, BH, BD);
const brickMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.02 });
bricksMesh = new THREE.InstancedMesh(brickGeo, brickMat, TOTAL);
bricksMesh.castShadow = true;
bricksMesh.receiveShadow = true;
scene.add(bricksMesh);

const partGeo = new THREE.BoxGeometry(1, 1, 1);
const partMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.02 });
debrisMesh = new THREE.InstancedMesh(partGeo, partMat, TOTAL * MAX_PARTS);
debrisMesh.receiveShadow = true;
scene.add(debrisMesh);

const brickColor = new THREE.Color();

function zeroMatrix() {
  tmpObj.position.set(0, -60, 0);
  tmpObj.rotation.set(0, 0, 0);
  tmpObj.scale.set(0.001, 0.001, 0.001);
  tmpObj.updateMatrix();
}

function genSeg(len, segs) {
  const weights = [];
  let wsum = 0;
  for (let i = 0; i < segs; i++) { const w = 0.4 + Math.random(); weights.push(w); wsum += w; }
  const bounds = [0];
  let acc = 0;
  for (let i = 0; i < segs - 1; i++) { acc += weights[i] / wsum * len; bounds.push(acc); }
  bounds.push(len);
  return bounds;
}

function splitBrick() {
  let sx = Math.random() < 0.85 ? 2 : 3;
  let sz = Math.random() < 0.75 ? 1 : 2;
  const sy = Math.random() < 0.1 ? 2 : 1;
  while (sx * sz * sy > MAX_PARTS) sx--;
  const bx = genSeg(BW, sx);
  const bz = genSeg(BD, sz);
  const by = genSeg(BH, sy);
  const units = [];
  for (let ix = 0; ix < sx; ix++) {
    for (let iz = 0; iz < sz; iz++) {
      for (let iy = 0; iy < sy; iy++) {
        units.push({
          ox: (bx[ix] + bx[ix + 1]) / 2 - BW / 2,
          oy: (by[iy] + by[iy + 1]) / 2 - BH / 2,
          oz: (bz[iz] + bz[iz + 1]) / 2 - BD / 2,
          hw: (bx[ix + 1] - bx[ix]) / 2,
          hh: (by[iy + 1] - by[iy]) / 2,
          hd: (bz[iz + 1] - bz[iz]) / 2
        });
      }
    }
  }
  return units;
}

function buildTower() {
  for (const blk of blocks) {
    for (const j of blk.joints) world.removeImpulseJoint(j);
    for (const p of blk.parts) world.removeRigidBody(p.body);
  }
  blocks = [];
  colliderOwner.clear();
  crushQueue.clear();
  blocksBroken = 0;
  zeroMatrix();
  for (let i = 0; i < TOTAL * MAX_PARTS; i++) debrisMesh.setMatrixAt(i, tmpObj.matrix);
  tmpObj.scale.set(1, 1, 1);

  for (let layer = 0; layer < LAYERS; layer++) {
    const yawOff = (layer % 2) * tang / 2;
    const y = BH / 2 + layer * BH;
    for (let i = 0; i < PER_LAYER; i++) {
      const a = yawOff + i * tang;
      const x = Math.cos(a) * R;
      const z = Math.sin(a) * R;
      const yaw = a + Math.PI / 2;
      const idx = layer * PER_LAYER + i;
      const q = { x: 0, y: Math.sin(yaw / 2), z: 0, w: Math.cos(yaw / 2) };
      const units = splitBrick();

      const parts = [];
      for (let p = 0; p < units.length; p++) {
        const u = units[p];
        const lx = u.ox * Math.cos(yaw) + u.oz * Math.sin(yaw);
        const lz = -u.ox * Math.sin(yaw) + u.oz * Math.cos(yaw);
        const body = world.createRigidBody(
          RAPIER.RigidBodyDesc.dynamic()
            .setTranslation(x + lx, y + u.oy, z + lz)
            .setRotation(q)
        );
        const collider = world.createCollider(
          RAPIER.ColliderDesc.cuboid(u.hw, u.hh, u.hd)
            .setFriction(1.0)
            .setRestitution(0.03)
            .setDensity(2.2),
          body
        );
        colliderOwner.set(collider.handle, idx);
        parts.push({
          body,
          scale: new THREE.Vector3(u.hw * 2, u.hh * 2, u.hd * 2)
        });
      }

      const joints = [];
      for (let p = 1; p < units.length; p++) {
        const jd = RAPIER.JointData.fixed(
          { x: (units[p].ox - units[0].ox) / 2, y: (units[p].oy - units[0].oy) / 2, z: (units[p].oz - units[0].oz) / 2 },
          { w: 1, x: 0, y: 0, z: 0 },
          { x: (units[0].ox - units[p].ox) / 2, y: (units[0].oy - units[p].oy) / 2, z: (units[0].oz - units[p].oz) / 2 },
          { w: 1, x: 0, y: 0, z: 0 }
        );
        joints.push(world.createImpulseJoint(jd, parts[0].body, parts[p].body, true));
      }

      tmpObj.position.set(x, y, z);
      tmpObj.rotation.set(0, yaw, 0);
      tmpObj.updateMatrix();
      bricksMesh.setMatrixAt(idx, tmpObj.matrix);
      brickColor.setHSL(0.045 + Math.random() * 0.02, 0.55 + Math.random() * 0.15, 0.42 + Math.random() * 0.12);
      bricksMesh.setColorAt(idx, brickColor);
      for (let p = 0; p < MAX_PARTS; p++) {
        debrisMesh.setColorAt(idx * MAX_PARTS + p, brickColor);
      }

      blocks.push({ brickIdx: idx, parts, joints, broken: false });
    }
  }
  bricksMesh.instanceMatrix.needsUpdate = true;
  bricksMesh.instanceColor.needsUpdate = true;
  debrisMesh.instanceColor.needsUpdate = true;

  exploded = false;
  settleTimer = 0;
  let slept = 0;
  let totalParts = 0;
  for (const blk of blocks) {
    totalParts += blk.parts.length;
    for (const p of blk.parts) {
      if (typeof p.body.sleep === 'function') { p.body.sleep(); slept++; }
    }
  }
  if (slept === totalParts) {
    stabilized = true;
    boomBtn.disabled = false;
    statusEl.textContent = '已就绪 · ' + TOTAL + ' 块砖稳稳堆叠,可以爆破';
  } else {
    stabilized = false;
    boomBtn.disabled = true;
    statusEl.textContent = '堆叠中…(物理引擎正在稳定砖块)';
  }
}

function syncSlot(mesh, slot, body, scale) {
  const t = body.translation();
  const r = body.rotation();
  tmpObj.position.set(t.x, t.y, t.z);
  tmpObj.quaternion.set(r.x, r.y, r.z, r.w);
  if (scale) {
    tmpObj.scale.copy(scale);
  } else {
    tmpObj.scale.set(1, 1, 1);
  }
  tmpObj.updateMatrix();
  mesh.setMatrixAt(slot, tmpObj.matrix);
}

function breakBlock(blk, g, imp, dir) {
  if (blk.broken) return;
  blk.broken = true;
  const n = blk.parts.length;
  const relFrac = Math.min(1, Math.max(0.15, (g - 1) / 2.5));
  const relCount = Math.max(1, Math.min(blk.joints.length, Math.round(blk.joints.length * relFrac)));
  for (let i = 0; i < relCount; i++) {
    if (blk.joints[i]) world.removeImpulseJoint(blk.joints[i]);
  }
  zeroMatrix();
  bricksMesh.setMatrixAt(blk.brickIdx, tmpObj.matrix);
  tmpObj.scale.set(1, 1, 1);

  const v = Math.min(24, 4 + g * 4);
  for (let i = 0; i < relCount; i++) {
    const part = blk.parts[i + 1];
    part.body.wakeUp();
    part.body.setLinvel({
      x: (dir.x + (Math.random() - 0.5) * 0.9) * v,
      y: (dir.y + 0.45 + (Math.random() - 0.5) * 0.9) * v,
      z: (dir.z + (Math.random() - 0.5) * 0.9) * v
    }, true);
    part.body.applyTorqueImpulse({
      x: (Math.random() - 0.5) * imp * 0.25,
      y: (Math.random() - 0.5) * imp * 0.25,
      z: (Math.random() - 0.5) * imp * 0.25
    }, true);
  }
  const main = blk.parts[0];
  main.body.wakeUp();
  if (imp) {
    main.body.applyImpulse({
      x: dir.x * imp * 0.55,
      y: (dir.y + 0.45) * imp * 0.55,
      z: dir.z * imp * 0.55
    }, true);
  }
  blocksBroken++;
  statusEl.textContent = '爆破中 · 已碎裂 ' + blocksBroken + ' 块砖 · 点击砖块可推飞';
}

function checkSettled() {
  let awake = 0;
  for (const blk of blocks) {
    if (!blk.parts[0].body.isSleeping()) awake++;
  }
  if (awake === 0) {
    stabilized = true;
    boomBtn.disabled = false;
    statusEl.textContent = '已就绪 · ' + TOTAL + ' 块砖稳稳堆叠,可以爆破';
  }
}

function explode() {
  if (!stabilized || exploded) return;
  exploded = true;
  const energy = energySlider.value / 100;
  for (const blk of blocks) {
    const t = blk.parts[0].body.translation();
    const dx = t.x, dy = t.y - BLAST_Y, dz = t.z;
    const d0 = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1.5;
    const imp = energy * 150000 / (d0 * d0);
    let nx = dx / d0, ny = dy / d0 + 0.25, nz = (dz / d0) * 1.3;
    const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
    nx /= nl; ny /= nl; nz /= nl;
    const g = imp / FRACTURE_T;
    if (g >= 1) {
      breakBlock(blk, g, imp, { x: nx, y: ny, z: nz });
    } else {
      for (const p of blk.parts) p.body.wakeUp();
      blk.parts[0].body.applyImpulse({ x: nx * imp * 0.9, y: ny * imp * 0.9, z: nz * imp * 0.9 }, true);
      blk.parts[0].body.applyTorqueImpulse({
        x: (Math.random() - 0.5) * imp * 0.1,
        y: (Math.random() - 0.5) * imp * 0.1,
        z: (Math.random() - 0.5) * imp * 0.1
      }, true);
    }
  }
  spawnEffects(energy);
  playBoom(energy);
  boomBtn.disabled = true;
}

function spawnEffects(energy) {
  smoke.position.set(0, BLAST_Y, 0);
  const sp = 3 + energy * 9;
  for (let i = 0; i < SMOKE_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 1 / 3) * 2.5;
    smokePos[i * 3] = Math.sin(v) * Math.cos(a) * r;
    smokePos[i * 3 + 1] = Math.sin(v) * Math.sin(a) * r;
    smokePos[i * 3 + 2] = Math.cos(v) * r;
    const s = sp * (0.4 + Math.random() * 0.9);
    smokeVel[i * 3] = smokePos[i * 3] * s;
    smokeVel[i * 3 + 1] = smokePos[i * 3 + 1] * s + 2 + Math.random() * 3;
    smokeVel[i * 3 + 2] = smokePos[i * 3 + 2] * s;
    smokeMaxLife[i] = 2.2 + Math.random() * 2.4;
    smokeLife[i] = 0;
    smokeSize[i] = 3 + Math.random() * 4;
    smokeAlpha[i] = 0;
  }
  smoke.visible = true;
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.aSize.needsUpdate = true;
  smokeGeo.attributes.aAlpha.needsUpdate = true;

  shockT = 0;
  shock.position.set(0, BLAST_Y, 0);
  shock.scale.set(0.5, 0.5, 0.5);
  shockMat.opacity = 0.5 * (0.4 + energy * 0.6);

  flashLight.intensity = 20000 * (0.3 + energy * 0.7);
  flashEl.style.opacity = 0.75;
  setTimeout(() => { flashEl.style.opacity = 0; }, 90);

  spawnSparks(energy);
  shake = 0.4 + energy * 1.1;
}

function updateSmoke(dt) {
  let any = false;
  for (let i = 0; i < SMOKE_N; i++) {
    if (smokeLife[i] >= smokeMaxLife[i]) { smokeAlpha[i] = 0; continue; }
    any = true;
    smokeLife[i] += dt;
    const d = smokeLife[i] / smokeMaxLife[i];
    smokePos[i * 3] += smokeVel[i * 3] * dt;
    smokePos[i * 3 + 1] += smokeVel[i * 3 + 1] * dt;
    smokePos[i * 3 + 2] += smokeVel[i * 3 + 2] * dt;
    smokeVel[i * 3 + 1] += 1.2 * dt;
    smokeVel[i * 3] *= (1 - 0.35 * dt);
    smokeVel[i * 3 + 1] *= (1 - 0.25 * dt);
    smokeVel[i * 3 + 2] *= (1 - 0.35 * dt);
    smokeAlpha[i] = Math.max(0, Math.sin(Math.min(d, 1) * Math.PI) * 0.5);
    smokeSize[i] += 3.5 * dt;
  }
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.aSize.needsUpdate = true;
  smokeGeo.attributes.aAlpha.needsUpdate = true;
  smoke.visible = any;
}

function updateShock(dt) {
  if (shockT < 0) return;
  shockT += dt;
  const t = shockT / 1.0;
  const s = 0.5 + t * 38;
  shock.scale.set(s, s, s);
  shockMat.opacity = Math.max(0, 0.5 * (1 - t));
  if (t >= 1) shockT = -1;
}

let audioCtx = null;
function playBoom(energy) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t0 = audioCtx.currentTime;
  const vol = 0.35 + energy * 0.65;
  const dur = 3.2;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900, t0);
  lp.frequency.exponentialRampToValueAtTime(50, t0 + dur * 0.7);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
  src.start(t0);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(70, t0);
  osc.frequency.exponentialRampToValueAtTime(24, t0 + dur * 0.8);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(vol * 0.8, t0);
  og.gain.exponentialRampToValueAtTime(0.001, t0 + dur * 0.9);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}

const camViews = {
  front: { pos: new THREE.Vector3(32, 20, 44), tgt: new THREE.Vector3(0, 11, 0) },
  top: { pos: new THREE.Vector3(0.1, 95, 0.1), tgt: new THREE.Vector3(0, 0, 0) },
  blast: { pos: new THREE.Vector3(15, 13, 17), tgt: new THREE.Vector3(0, BLAST_Y, 0) }
};
let camView = 'front';
camera.position.copy(camViews.front.pos);
controls.target.copy(camViews.front.tgt);
let shake = 0;

document.querySelectorAll('.camBtn').forEach(b => {
  b.addEventListener('click', () => {
    camView = b.dataset.cam;
    document.querySelectorAll('.camBtn').forEach(x => x.classList.toggle('active', x === b));
  });
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (!exploded) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hitB = raycaster.intersectObject(bricksMesh);
  if (hitB.length) {
    const blk = blocks[hitB[0].instanceId];
    if (!blk.broken) {
      const dir = camera.getWorldDirection(new THREE.Vector3());
      for (const p of blk.parts) p.body.wakeUp();
      blk.parts[0].body.applyImpulse({ x: dir.x * 1600, y: dir.y * 1600 + 260, z: dir.z * 1600 }, true);
      return;
    }
  }
  const hitD = raycaster.intersectObject(debrisMesh);
  if (hitD.length) {
    const slot = hitD[0].instanceId;
    const pi = slot % MAX_PARTS;
    const blk = blocks[Math.floor(slot / MAX_PARTS)];
    if (pi < blk.parts.length) {
      const dir = camera.getWorldDirection(new THREE.Vector3());
      const part = blk.parts[pi];
      part.body.wakeUp();
      part.body.applyImpulse({ x: dir.x * 700, y: dir.y * 700 + 180, z: dir.z * 700 }, true);
    }
  }
});

energySlider.addEventListener('input', () => { eValEl.textContent = energySlider.value; });
boomBtn.addEventListener('click', explode);
resetBtn.addEventListener('click', reset);

function reset() {
  for (const blk of blocks) {
    for (const j of blk.joints) world.removeImpulseJoint(j);
    for (const p of blk.parts) world.removeRigidBody(p.body);
  }
  blocks = [];
  colliderOwner.clear();
  crushQueue.clear();
  for (let i = 0; i < SMOKE_N; i++) smokeLife[i] = 999;
  smoke.visible = false;
  shockT = -1;
  shockMat.opacity = 0;
  flashLight.intensity = 0;
  flashEl.style.opacity = 0;
  for (let i = 0; i < SPARK_N; i++) sparks[i].alive = false;
  sparkMesh.count = 0;
  shake = 0;
  buildTower();
}

function updateInstances() {
  for (const blk of blocks) {
    if (blk.broken) {
      for (let i = 0; i < blk.parts.length; i++) {
        const part = blk.parts[i];
        if (part.body.isSleeping()) continue;
        syncSlot(debrisMesh, blk.brickIdx * MAX_PARTS + i, part.body, part.scale);
      }
    } else {
      const part = blk.parts[0];
      if (part.body.isSleeping()) continue;
      syncSlot(bricksMesh, blk.brickIdx, part.body, null);
    }
  }
  bricksMesh.instanceMatrix.needsUpdate = true;
  debrisMesh.instanceMatrix.needsUpdate = true;
}

function processCrushQueue() {
  let budget = MAX_CRUSH_PER_FRAME;
  for (const [blkId, info] of crushQueue) {
    if (budget <= 0) break;
    const blk = blocks[blkId];
    if (blk && !blk.broken) {
      breakBlock(blk, 1.6, info.dv * 500, { x: info.nx, y: info.ny, z: info.nz });
      budget--;
    }
  }
  crushQueue.clear();
}

const clock = new THREE.Clock();
let settleCheck = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  world.step(eventQueue);
  eventQueue.drainCollisionEvents((h1, h2, started) => {
    if (!started) return;
    const o1 = colliderOwner.get(h1);
    const o2 = colliderOwner.get(h2);
    if (o1 === undefined && o2 === undefined) return;
    if (o1 !== undefined && o2 !== undefined && o1 === o2) return;
    let blkId = -1;
    if (o1 !== undefined && !blocks[o1].broken) blkId = o1;
    else if (o2 !== undefined && !blocks[o2].broken) blkId = o2;
    if (blkId < 0) return;
    const v1 = world.getCollider(h1).parent().linvel();
    const v2 = world.getCollider(h2).parent().linvel();
    const dvx = v1.x - v2.x, dvy = v1.y - v2.y, dvz = v1.z - v2.z;
    const dv = Math.sqrt(dvx * dvx + dvy * dvy + dvz * dvz);
    if (dv > CRASH_SPEED) {
      const cur = crushQueue.get(blkId);
      const dl = dv || 1;
      if (!cur || cur.dv < dv) {
        crushQueue.set(blkId, { dv, nx: dvx / dl, ny: dvy / dl, nz: dvz / dl });
      }
    }
  });
  processCrushQueue();

  updateInstances();
  updateSmoke(dt);
  updateSparks(dt);
  updateShock(dt);
  flashLight.intensity *= 0.86;

  if (!stabilized) {
    settleTimer += dt;
    settleCheck += dt;
    if (settleCheck > 0.4) {
      settleCheck = 0;
      checkSettled();
    }
    if (settleTimer > 20) {
      stabilized = true;
      boomBtn.disabled = false;
      statusEl.textContent = '已就绪(超时)· 可以爆破';
    }
  }

  const cv = camViews[camView];
  camera.position.lerp(cv.pos, 0.06);
  controls.target.lerp(cv.tgt, 0.06);
  if (shake > 0) {
    shake -= dt;
    camera.position.x += (Math.random() - 0.5) * shake * 0.4;
    camera.position.y += (Math.random() - 0.5) * shake * 0.4;
    camera.position.z += (Math.random() - 0.5) * shake * 0.4;
  }
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

buildTower();
animate();
</script>
</body>
</html>
