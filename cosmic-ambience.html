<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星夜 · 古琴</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; cursor: pointer; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at center, rgba(60,50,120,.28), rgba(5,4,16,.9));
    color: #e8dcff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    z-index: 10; cursor: pointer; user-select: none; transition: opacity 0.5s;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: 32px; letter-spacing: 10px; font-weight: 300; text-shadow: 0 0 30px rgba(200,160,255,.9); }
  #overlay p { font-size: 14px; letter-spacing: 3px; color: rgba(220,200,255,.75); }
  #overlay .dot { width: 8px; height: 8px; border-radius: 50%; background: #d9b8ff; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.4); } }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    color: rgba(220,200,255,.55); font-size: 12px; letter-spacing: 3px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    z-index: 9; pointer-events: none; text-align: center;
    text-shadow: 0 0 14px rgba(180,130,255,.7);
  }
  #hud span { opacity: 0; transition: opacity 1s; }
  #hud.on span { opacity: 1; }
  #err {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #ffb0b0; font-size: 12px; font-family: monospace;
    background: rgba(40,0,10,.7); padding: 6px 12px; border-radius: 4px;
    z-index: 20; display: none; white-space: pre-wrap; max-width: 90vw;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>古琴 · 宫商角徵羽 · 双击停止</span></div>
<div id="err"></div>
<div id="overlay">
  <h1>星夜 · 古琴</h1>
  <p>宫商角徵羽 · 琴音实时合成</p>
  <div class="dot"></div>
  <p style="font-size:12px; opacity:.55;">单击开始 · 双击停止</p>
</div>
<script>
(() => {
  'use strict';

  window.addEventListener('error', function (e) {
    const err = document.getElementById('err');
    if (err) {
      err.style.display = 'block';
      err.textContent = '错误: ' + e.message + ' @行' + e.lineno;
    }
  });

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  let W = 0, H = 0, DPR = 1;

  let stars = [];
  function genStars() {
    stars = [];
    const colors = ['255,255,255', '200,215,255', '255,215,240', '255,235,200', '190,180,255'];
    for (let i = 0; i < 420; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.5 + Math.random() * 1.2,
        c: colors[(Math.random() * colors.length) | 0],
        a: 0.3 + Math.random() * 0.6,
        sp: 0.4 + Math.random() * 2.2,
        ph: Math.random() * 6.283
      });
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05030f';
    ctx.fillRect(0, 0, W, H);
    genStars();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------------- 音频:仅古琴 ---------------- */
  let ac = null;
  let audioStarted = false;
  let master = null;
  let analyser = null;
  let reverbGain = null;
  let longReverbGain = null;
  let schedId = null;

  function makeReverb(sec, decay) {
    const rate = ac.sampleRate;
    const buf = ac.createBuffer(2, Math.floor(sec * rate), rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, decay);
      }
    }
    const conv = ac.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  const GUQIN_SCALE = [130.81, 146.83, 164.81, 196.00, 220.00];
  let melIdx = 2;

  function playGuqin(t) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const step = Math.random() < 0.3 ? 2 : 1;
    melIdx = Math.max(0, Math.min(4, melIdx + dir * step));
    if (Math.random() < 0.15) melIdx = (Math.random() * 5) | 0;
    const oct = Math.random() < 0.22 ? 2 : 1;
    const f = GUQIN_SCALE[melIdx] * oct;

    const vib = ac.createOscillator();
    vib.frequency.value = 4;
    const vibG = ac.createGain();
    vibG.gain.value = f * 0.004;
    vib.connect(vibG);

    const o1 = ac.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(f * 0.988, t);
    o1.frequency.linearRampToValueAtTime(f, t + 0.12);
    vibG.connect(o1.frequency);
    const g1 = ac.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.05, t + 0.04);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 12);

    const o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(f * 2 * 0.988, t);
    o2.frequency.linearRampToValueAtTime(f * 2, t + 0.09);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.008, t + 0.025);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 3);

    const o3 = ac.createOscillator();
    o3.type = 'sine';
    o3.frequency.value = f * 3;
    const g3 = ac.createGain();
    g3.gain.setValueAtTime(0.0001, t);
    g3.gain.exponentialRampToValueAtTime(0.003, t + 0.02);
    g3.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);

    o1.connect(g1);
    o2.connect(g2);
    o3.connect(g3);
    g1.connect(reverbGain);
    g2.connect(reverbGain);
    g3.connect(reverbGain);
    g1.connect(longReverbGain);
    g1.connect(master);
    g2.connect(master);
    g3.connect(master);
    o1.start(t); o1.stop(t + 12.2);
    o2.start(t); o2.stop(t + 3.2);
    o3.start(t); o3.stop(t + 1.7);
    vib.start(t); vib.stop(t + 12.2);
  }

  let nextMelody = 0;

  function scheduler() {
    if (ac.currentTime > nextMelody) {
      playGuqin(ac.currentTime);
      nextMelody = ac.currentTime + 4 + Math.random() * 6;
    }
  }

  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    overlay.classList.add('hide');
    setTimeout(() => { overlay.style.display = 'none'; }, 600);
    hud.classList.add('on');
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = 0.8;
        master.connect(ac.destination);
        analyser = ac.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.72;
        master.connect(analyser);
      }
      ac.resume();
      reverbGain = ac.createGain();
      reverbGain.gain.value = 0.7;
      reverbGain.connect(master);
      const reverb = makeReverb(6, 3.6);
      reverb.connect(reverbGain);
      longReverbGain = ac.createGain();
      longReverbGain.gain.value = 0.3;
      longReverbGain.connect(master);
      const longReverb = makeReverb(11, 5.5);
      longReverb.connect(longReverbGain);

      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Float32Array(analyser.fftSize);
      playGuqin(ac.currentTime + 0.05);
      nextMelody = ac.currentTime + 5 + Math.random() * 4;

      schedId = setInterval(scheduler, 25);
    } catch (e) {
      const err = document.getElementById('err');
      err.style.display = 'block';
      err.textContent = '音频初始化失败: ' + e.message;
      audioStarted = false;
      overlay.classList.remove('hide');
    }
  }

  function stopAudio() {
    if (!audioStarted) return;
    audioStarted = false;
    if (schedId) {
      clearInterval(schedId);
      schedId = null;
    }
    try {
      ac.close();
    } catch (e) { /* ignore */ }
    ac = null;
    master = null;
    analyser = null;
    reverbGain = null;
    longReverbGain = null;
    freqData = new Uint8Array(1024);
    timeData = new Float32Array(1024);
    overlay.classList.remove('hide');
    overlay.style.display = '';
    hud.classList.remove('on');
  }

  document.addEventListener('click', startAudio);
  document.addEventListener('dblclick', stopAudio);

  /* ---------------- 视觉:星空 + 流萤 ---------------- */
  let freqData = new Uint8Array(1024);
  let timeData = new Float32Array(1024);

  function lowEnergy() {
    let s = 0;
    for (let i = 1; i < 24; i++) s += freqData[i];
    return s / (23 * 255);
  }

  function drawNebula(xr, yr, rr, rgb, a) {
    const x = xr * W, y = yr * H, r = rr * W;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  const FLIES = 55;
  const flies = [];
  for (let i = 0; i < FLIES; i++) {
    flies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 40,
      vy: (Math.random() - 0.5) * 40,
      maxSp: 14 + Math.random() * 30,
      size: 1.4 + Math.random() * 1.4,
      hue: 62 + Math.random() * 50,
      rate: 0.8 + Math.random() * 2.2,
      phase: Math.random() * 6.283
    });
  }

  function updateFireflies(dt, low) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flies) {
      f.phase += dt * f.rate * 3.14159;
      f.vx += (Math.random() - 0.5) * 46 * dt;
      f.vy += (Math.random() - 0.5) * 46 * dt;
      const sp = Math.hypot(f.vx, f.vy);
      if (sp > f.maxSp) {
        f.vx *= f.maxSp / sp;
        f.vy *= f.maxSp / sp;
      }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.x < -12) f.x = W + 12;
      if (f.x > W + 12) f.x = -12;
      if (f.y < -12) f.y = H + 12;
      if (f.y > H + 12) f.y = -12;
      const tw = Math.sin(f.phase);
      const glow = Math.max(0, tw * tw) * (0.5 + 0.5 * low);
      ctx.strokeStyle = 'hsla(' + f.hue.toFixed(0) + ',90%,62%,' + (glow * 0.35).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x - f.vx * 0.07, f.y - f.vy * 0.07);
      ctx.stroke();
      ctx.fillStyle = 'hsla(' + f.hue.toFixed(0) + ',95%,70%,' + glow.toFixed(3) + ')';
      ctx.fillRect(f.x, f.y, f.size, f.size);
    }
    ctx.restore();
  }

  let t = 0;
  let lastT = performance.now();

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    t += dt;

    let low = 0;
    if (audioStarted) {
      analyser.getByteFrequencyData(freqData);
      analyser.getFloatTimeDomainData(timeData);
      low = lowEnergy();
    }

    ctx.fillStyle = 'rgba(3,5,16,0.12)';
    ctx.fillRect(0, 0, W, H);

    updateFireflies(dt, low);

    drawNebula(0.3, 0.34, 0.42, '160,120,255', 0.05 + low * 0.015);
    drawNebula(0.72, 0.27, 0.38, '255,140,200', 0.045 + low * 0.015);
    drawNebula(0.5, 0.78, 0.45, '120,200,255', 0.04 + low * 0.015);
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
      ctx.fillStyle = 'rgba(' + s.c + ',' + (s.a * tw * 0.85).toFixed(3) + ')';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
