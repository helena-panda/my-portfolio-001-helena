<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>递归 · 分形树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1424; }
  canvas { display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const MAX_DEPTH = 10;
  const LEN_FACTOR = 0.74;
  const BASE_ANGLE = 0.5;
  const LEVEL_DURATION = 0.3;
  const BRANCH_DUR = 0.55;

  let W = 0, H = 0, DPR = 1;
  let stars = [];

  const rand = Math.random;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOutSine = x => 0.5 * (1 - Math.cos(Math.PI * x));

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = [];
    const n = Math.round(Math.min(90, W * H / 22000));
    for (let i = 0; i < n; i++) {
      stars.push({ x: rand() * W, y: rand() * H * 0.72, r: 0.5 + rand() * 1.3, tw: 0.4 + rand() * 2, ph: rand() * 6.283 });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function makeBranch(depth, rel, t0) {
    const b = { depth, rel, t: t0, dur: BRANCH_DUR * (0.85 + rand() * 0.3), ph: rand() * 6.283, kids: [] };
    if (depth < MAX_DEPTH) {
      const lf = LEN_FACTOR * (0.9 + rand() * 0.18);
      const k = depth < 2 ? 0.58 : 0.75 + (depth / MAX_DEPTH) * 0.75;
      const a1 = BASE_ANGLE * k * (0.8 + rand() * 0.35);
      const a2 = BASE_ANGLE * k * (0.8 + rand() * 0.35);
      const tC = t0 + LEVEL_DURATION + rand() * LEVEL_DURATION * 0.3;
      const c1 = makeBranch(depth + 1, rel * lf, tC);
      const c2 = makeBranch(depth + 1, rel * lf, tC + rand() * 0.05);
      c1.ang = a1;
      c2.ang = a2;
      b.kids.push(c1, c2);
    }
    return b;
  }

  const root = makeBranch(0, 1, 0);

  function maxFinish(b) {
    let m = b.t + b.dur;
    for (const k of b.kids) m = Math.max(m, maxFinish(k));
    return m;
  }
  const GROW_TOTAL = maxFinish(root);
  const CYCLE = GROW_TOTAL + 6.5;

  let time = 0;
  let growT = 0;
  let interactive = false;
  let mouseX = 0, mouseY = 0;
  let wind = 0, spread = 1;
  let windTarget = 0, spreadTarget = 1;
  let activeDepth = -1;

  function update() {
    const cyc = time % CYCLE;
    if (interactive) {
      growT = 1;
      windTarget = clamp((mouseX / W - 0.5) * 2, -1, 1) * 0.5;
      spreadTarget = 0.35 + (1 - clamp(mouseY / H, 0, 1)) * 0.95;
    } else if (cyc < GROW_TOTAL) {
      growT = easeInOutSine(clamp(cyc / GROW_TOTAL, 0, 1));
      windTarget = 0;
      spreadTarget = 1;
    } else {
      growT = 1;
      windTarget = Math.sin(time * 0.45) * 0.05 + Math.sin(time * 0.12 + 1.7) * 0.02;
      spreadTarget = 1;
    }
    wind += (windTarget - wind) * 0.04;
    spread += (spreadTarget - spread) * 0.06;
    activeDepth = -1;
  }

  function branchColor(t) {
    return 'hsl(' + lerp(24, 96, t).toFixed(1) + ',48%,' + lerp(20, 66, t).toFixed(1) + '%)';
  }

  function drawBranch(b, x, y, ang, baseLen) {
    const vt = growT * GROW_TOTAL;
    const p = clamp((vt - b.t) / b.dur, 0, 1);
    if (p <= 0) return;
    if (p < 1 && b.depth > activeDepth) activeDepth = b.depth;
    const e = 1 - Math.pow(1 - p, 3);
    const len = b.rel * baseLen * e;
    const sway = Math.sin(time * 1.6 + b.ph) * wind * (0.4 + b.depth * 0.1);
    const a = ang + sway;
    const ex = x + len * Math.cos(a);
    const ey = y - len * Math.sin(a);
    const t = b.depth / MAX_DEPTH;
    ctx.strokeStyle = branchColor(t);
    ctx.lineWidth = lerp(7, 1.1, t);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (b.depth === MAX_DEPTH) {
      ctx.fillStyle = 'hsla(80,80%,72%,0.85)';
      ctx.beginPath();
      ctx.arc(ex + Math.cos(a + 1.1) * 6, ey - Math.sin(a + 1.1) * 6, 1.7, 0, 6.283);
      ctx.arc(ex + Math.cos(a - 1.1) * 6, ey - Math.sin(a - 1.1) * 6, 1.7, 0, 6.283);
      ctx.fill();
    }
    if (b.kids.length) {
      drawBranch(b.kids[0], ex, ey, a + b.kids[0].ang * spread, baseLen);
      drawBranch(b.kids[1], ex, ey, a - b.kids[1].ang * spread, baseLen);
    }
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function panel(x, y, w, h) {
    roundRectPath(x, y, w, h, 10);
    ctx.fillStyle = 'rgba(8,16,30,0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1424');
    g.addColorStop(0.6, '#0e1c30');
    g.addColorStop(1, '#14283e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const mx = W * 0.8, my = H * 0.15, mr = 30;
    const halo = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4);
    halo.addColorStop(0, 'rgba(230,240,255,0.30)');
    halo.addColorStop(1, 'rgba(230,240,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    ctx.fillStyle = '#eef4ff';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, 6.283);
    ctx.fill();
    for (const s of stars) {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(time * s.tw + s.ph));
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.283);
      ctx.fill();
    }
  }

  function drawWind() {
    const a = clamp(0.05 + Math.abs(wind) * 0.25, 0, 0.24);
    if (a < 0.06) return;
    ctx.strokeStyle = 'rgba(215,235,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    const n = 9, seg = 150;
    for (let i = 0; i < n; i++) {
      const y = H * (0.14 + 0.62 * i / (n - 1)) + Math.sin(i * 2.7) * 14;
      const spd = 70 + i * 16;
      let x = ((time * wind * spd) % (W + seg * 4)) - seg * 2;
      for (let k = 0; k < 4; k++) {
        const x0 = x + k * seg;
        const amp = 5 + Math.sin(i * 1.9 + k * 1.3) * 4;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.quadraticCurveTo(x0 + seg * 0.5, y - amp, x0 + seg, y + amp * 0.4);
        ctx.stroke();
      }
    }
  }

  function drawHUD() {
    const px = 18, py = 18, pw = 278;
    panel(px, py, pw, 132);
    ctx.textAlign = 'left';
    ctx.font = '700 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(235,245,255,0.95)';
    ctx.fillText('递归 · 分形树', px + 16, py + 34);
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,0.8)';
    ctx.fillText('每根枝条递归分裂出两根新枝', px + 16, py + 58);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('f(n) = 2 × f(n−1)', px + 16, py + 78);
    if (growT < 1) {
      const d = Math.max(activeDepth, 0);
      ctx.fillStyle = '#8cffb0';
      ctx.font = '600 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('生长中 · 深度 ' + (d + 1) + '/' + MAX_DEPTH, px + 16, py + 106);
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(200,220,240,0.8)';
      ctx.fillText('已生成 2^' + (d + 1) + '−1 = ' + (Math.pow(2, d + 1) - 1) + ' 条分支', px + 16, py + 126);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('生长完成 · 共 ' + (Math.pow(2, MAX_DEPTH + 1) - 1) + ' 条分支', px + 16, py + 106);
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(200,220,240,0.8)';
      ctx.fillText(interactive ? '交互模式运行中' : '微风 · 树在摇曳', px + 16, py + 126);
    }
  }

  function drawStack() {
    const pw = 232;
    const px = W - pw - 18;
    const py = Math.max(110, H * 0.26);
    ctx.textAlign = 'left';
    if (growT >= 1) {
      panel(px, py, pw, 150);
      ctx.font = '600 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(235,245,255,0.9)';
      ctx.fillText('递归调用栈', px + 14, py + 26);
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(140,255,170,0.9)';
      ctx.fillText('递归全部返回', px + 14, py + 56);
      ctx.fillStyle = 'rgba(200,220,240,0.6)';
      ctx.fillText('栈已清空', px + 14, py + 76);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('最深一层调用先返回,', px + 14, py + 110);
      ctx.fillText('逐层出栈回到根节点。', px + 14, py + 130);
      return;
    }
    const d = Math.max(activeDepth, 0);
    const ph = 60 + (d + 1) * 34 + 30;
    panel(px, py, pw, ph);
    ctx.font = '600 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(235,245,255,0.9)';
    ctx.fillText('递归调用栈', px + 14, py + 26);
    for (let i = 0; i <= d; i++) {
      const y = py + 40 + i * 34;
      const act = i === d;
      roundRectPath(px + 14, y, pw - 28, 26, 6);
      ctx.fillStyle = act ? 'rgba(120,255,180,0.15)' : 'rgba(255,255,255,0.045)';
      ctx.fill();
      ctx.strokeStyle = act ? 'rgba(120,255,180,0.6)' : 'rgba(255,255,255,0.13)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.font = '12px Consolas, "Courier New", monospace';
      ctx.fillStyle = act ? '#8cffb0' : 'rgba(255,255,255,0.45)';
      ctx.fillText('drawBranch(' + i + ')', px + 24, y + 17);
      if (act) {
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(140,255,170,0.85)';
        ctx.fillText('● 生长中', px + pw - 88, y + 17);
      }
    }
    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,0.55)';
    ctx.fillText('新调用压栈 · 最深 ' + (d + 1) + ' 层', px + 14, py + 40 + (d + 1) * 34 + 10);
  }

  function drawHint() {
    const msg = interactive
      ? '交互模式 · 左右移动 = 风向  |  上下移动 = 伸展  |  点击退出'
      : '点击画面 进入交互模式';
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(msg).width;
    const w = tw + 40, x = (W - w) / 2, y = H - 52;
    panel(x, y, w, 34);
    ctx.textAlign = 'center';
    ctx.fillStyle = interactive ? 'rgba(140,255,170,0.95)' : 'rgba(235,245,255,0.85)';
    ctx.fillText(msg, x + w / 2, y + 22);
    if (interactive) {
      ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(200,220,240,0.75)';
      ctx.fillText('风力 ' + (wind * 2).toFixed(2) + ' · 伸展 ' + Math.round(spread * 100) + '%', x + w / 2, y - 10);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawWind();
    const baseLen = Math.max(110, H * 0.22);
    drawBranch(root, W / 2, H + 24, Math.PI / 2, baseLen);
    drawHUD();
    drawStack();
    drawHint();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;
    update();
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  canvas.addEventListener('pointermove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  canvas.addEventListener('pointerdown', e => {
    interactive = !interactive;
    if (!interactive) time = GROW_TOTAL + 0.1;
  });
})();
</script>
</body>
</html>
