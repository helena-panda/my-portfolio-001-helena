<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆物理模拟器 · 简谐振动</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a24;
    color: #cfd6e6;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    position: relative;
    min-height: 0;
    display: flex;
  }
  #pendulum {
    flex: 1;
    min-width: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #side {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    box-sizing: border-box;
    background: rgba(10, 12, 20, 0.6);
    border-left: 1px solid rgba(120, 200, 255, 0.15);
  }
  .plot {
    position: relative;
    flex: 1;
    min-height: 0;
    border: 1px solid rgba(120, 200, 255, 0.18);
    border-radius: 8px;
    background: rgba(10, 12, 20, 0.55);
    overflow: hidden;
  }
  .plot canvas {
    position: absolute;
    left: 0;
    top: 0;
  }
  .ptTitle {
    position: absolute;
    top: 8px;
    left: 10px;
    z-index: 2;
    font-size: 11px;
    color: #8e99b8;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
  #panel {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 24px;
    align-items: center;
    padding: 10px 18px;
    background: rgba(10, 12, 20, 0.85);
    border-top: 1px solid rgba(120, 200, 255, 0.15);
  }
  .ctl {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 168px;
  }
  .ctl label {
    font-size: 12px;
    color: #8e99b8;
  }
  .ctl span {
    font-size: 13px;
    color: #7fd4ff;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ctl input[type=range] {
    width: 176px;
    accent-color: #5d8fe8;
  }
  .scene {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .scene label {
    font-size: 12px;
    color: #8e99b8;
  }
  .scene span {
    font-size: 13px;
    color: #7fd4ff;
    font-weight: 600;
  }
  .sceneBtns {
    display: flex;
    gap: 8px;
  }
  .sceneBtn {
    padding: 6px 14px;
    background: rgba(120, 200, 255, 0.08);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 6px;
    color: #cfd6e6;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .sceneBtn:hover {
    border-color: #7fa5f5;
  }
  .sceneBtn.active {
    background: #5d8fe8;
    border-color: #5d8fe8;
    color: #0b0e16;
    font-weight: 600;
  }
  #resetBtn {
    margin-left: auto;
    padding: 9px 20px;
    background: #5d8fe8;
    border: none;
    border-radius: 6px;
    color: #0b0e16;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  #resetBtn:hover {
    background: #6fa0f5;
  }
  #resetBtn:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="pendulum"></canvas>
  <div id="side">
    <div class="plot">
      <div class="ptTitle">相图 Θ – ω</div>
      <canvas id="phase"></canvas>
    </div>
    <div class="plot">
      <div class="ptTitle">动能 / 势能</div>
      <canvas id="energy"></canvas>
    </div>
  </div>
</div>
<div id="panel">
  <div class="scene">
    <label>天体场景 <span id="sceneVal">地球</span></label>
    <div class="sceneBtns">
      <button type="button" class="sceneBtn active" data-name="地球" data-g="9.8">地球</button>
      <button type="button" class="sceneBtn" data-name="月球" data-g="1.62">月球</button>
      <button type="button" class="sceneBtn" data-name="火星" data-g="3.71">火星</button>
    </div>
  </div>
  <div class="ctl">
    <label>摆长 <span id="lenVal">200 px</span></label>
    <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
  </div>
  <div class="ctl">
    <label>重力 <span id="gVal">9.8 m/s²</span></label>
    <input type="range" id="gSlider" min="1" max="25" step="0.01" value="9.8">
  </div>
  <div class="ctl">
    <label>阻尼 <span id="dampVal">0.000</span></label>
    <input type="range" id="dampSlider" min="0" max="0.01" step="0.001" value="0">
  </div>
  <button id="resetBtn" type="button">重置摆动</button>
</div>
<script>
const canvas = document.getElementById('pendulum');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

const lenSlider = document.getElementById('lenSlider');
const gSlider = document.getElementById('gSlider');
const dampSlider = document.getElementById('dampSlider');
const lenVal = document.getElementById('lenVal');
const gVal = document.getElementById('gVal');
const dampVal = document.getElementById('dampVal');
const resetBtn = document.getElementById('resetBtn');
const sceneVal = document.getElementById('sceneVal');
const sceneBtns = Array.from(document.querySelectorAll('.sceneBtn'));
const phaseCanvas = document.getElementById('phase');
const phaseCtx = phaseCanvas.getContext('2d');
const energyCanvas = document.getElementById('energy');
const energyCtx = energyCanvas.getContext('2d');

const PRESETS = [
  { name: '地球', g: 9.8 },
  { name: '月球', g: 1.62 },
  { name: '火星', g: 3.71 }
];
const STORAGE_KEY = 'pendulum-state';

const SCALE = 100;
const DAMPING_GAIN = 60;
const INITIAL_ANGLE = Math.PI / 4;
const MASS = 1;
let phasePoints = [];
let maxEnergyRef = 0;

let W = 0;
let H = 0;
let LENGTH = 200;
let GRAVITY = 9.8;
let DAMPING = 0;

let angle = INITIAL_ANGLE;
let angularVelocity = 0;
let lastTime = null;

const pivot = { x: 0, y: 0 };

function sizeCanvas(c, cctx, w, h, dpr) {
  c.width = w * dpr;
  c.height = h * dpr;
  c.style.width = w + 'px';
  c.style.height = h + 'px';
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  sizeCanvas(canvas, ctx, W, H, dpr);
  const pw = phaseCanvas.parentElement.clientWidth;
  const ph = phaseCanvas.parentElement.clientHeight;
  sizeCanvas(phaseCanvas, phaseCtx, pw, ph, dpr);
  const ew = energyCanvas.parentElement.clientWidth;
  const eh = energyCanvas.parentElement.clientHeight;
  sizeCanvas(energyCanvas, energyCtx, ew, eh, dpr);
}

function updatePivot() {
  pivot.x = W / 2;
  pivot.y = Math.min(170, H * 0.22);
}

function step(dt) {
  const angularAcceleration =
    -(GRAVITY / (LENGTH / SCALE)) * Math.sin(angle) -
    DAMPING * DAMPING_GAIN * angularVelocity;
  angularVelocity += angularAcceleration * dt;
  angle += angularVelocity * dt;
}

function pendulumLengthM() {
  return LENGTH / SCALE;
}

function kineticEnergy() {
  const l = pendulumLengthM();
  return 0.5 * MASS * l * l * angularVelocity * angularVelocity;
}

function potentialEnergy() {
  const l = pendulumLengthM();
  return MASS * GRAVITY * l * (1 - Math.cos(angle));
}

function totalEnergy() {
  return kineticEnergy() + potentialEnergy();
}

function updateMaxEnergyRef() {
  maxEnergyRef = MASS * GRAVITY * pendulumLengthM() * (1 - Math.cos(INITIAL_ANGLE));
}

function resetPhase() {
  phasePoints.length = 0;
  updateMaxEnergyRef();
}

function draw() {
  const bobX = pivot.x + LENGTH * Math.sin(angle);
  const bobY = pivot.y + LENGTH * Math.cos(angle);

  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(150, 160, 190, 0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pivot.x, pivot.y);
  ctx.lineTo(bobX, bobY);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(pivot.x, pivot.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#8e99b8';
  ctx.fill();

  const glow = ctx.createRadialGradient(bobX, bobY, 0, bobX, bobY, 26);
  glow.addColorStop(0, 'rgba(120, 200, 255, 0.55)');
  glow.addColorStop(1, 'rgba(120, 200, 255, 0)');
  ctx.beginPath();
  ctx.arc(bobX, bobY, 26, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  ctx.shadowColor = 'rgba(120, 200, 255, 0.9)';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(bobX, bobY, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#5d8fe8';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPhase() {
  const pw = phaseCanvas.clientWidth;
  const ph = phaseCanvas.clientHeight;
  const cx = pw / 2;
  const cy = ph / 2;
  const l = pendulumLengthM();
  const omRef = Math.sqrt(2 * (GRAVITY / l) * (1 - Math.cos(INITIAL_ANGLE))) * 1.1;
  const thRef = INITIAL_ANGLE * 1.25;
  const sx = (pw - 20) / (2 * thRef);
  const sy = (ph - 20) / (2 * omRef);

  phaseCtx.clearRect(0, 0, pw, ph);

  phaseCtx.strokeStyle = 'rgba(150, 160, 190, 0.15)';
  phaseCtx.lineWidth = 1;
  phaseCtx.beginPath();
  phaseCtx.moveTo(10, cy);
  phaseCtx.lineTo(pw - 10, cy);
  phaseCtx.moveTo(cx, 10);
  phaseCtx.lineTo(cx, ph - 10);
  phaseCtx.stroke();

  phaseCtx.font = '10px sans-serif';
  phaseCtx.fillStyle = 'rgba(142, 153, 184, 0.85)';
  phaseCtx.textAlign = 'center';
  phaseCtx.fillText('θ', pw - 16, cy - 6);
  phaseCtx.fillText('ω', cx + 6, 14);
  phaseCtx.fillText(thRef.toFixed(1) + ' rad', pw - 44, cy + 12);
  phaseCtx.fillText('-' + thRef.toFixed(1), 54, cy + 12);
  phaseCtx.fillText(omRef.toFixed(1) + ' rad/s', cx - 26, 18);

  const n = phasePoints.length;
  for (let i = 1; i < n; i++) {
    const p0 = phasePoints[i - 1];
    const p1 = phasePoints[i];
    const t = n < 2 ? 1 : i / (n - 1);
    phaseCtx.strokeStyle = `hsla(${200 + t * 120}, 90%, 65%, ${(0.15 + t * 0.8).toFixed(3)})`;
    phaseCtx.lineWidth = 1.4;
    phaseCtx.beginPath();
    phaseCtx.moveTo(p0.th * sx + cx, cy - p0.om * sy);
    phaseCtx.lineTo(p1.th * sx + cx, cy - p1.om * sy);
    phaseCtx.stroke();
  }

  const last = phasePoints[n - 1];
  if (last) {
    const px = last.th * sx + cx;
    const py = cy - last.om * sy;
    phaseCtx.shadowColor = 'rgba(120, 200, 255, 0.9)';
    phaseCtx.shadowBlur = 8;
    phaseCtx.beginPath();
    phaseCtx.arc(px, py, 3.5, 0, Math.PI * 2);
    phaseCtx.fillStyle = '#7fd4ff';
    phaseCtx.fill();
    phaseCtx.shadowBlur = 0;
  }
}

function drawEnergy() {
  const ew = energyCanvas.clientWidth;
  const eh = energyCanvas.clientHeight;
  const ke = kineticEnergy();
  const pe = potentialEnergy();
  const tot = ke + pe;
  const ref = Math.max(maxEnergyRef, 1e-6);

  energyCtx.clearRect(0, 0, ew, eh);

  const barX = 66;
  const barW = ew - barX - 12;
  const rows = 3;
  const gap = 8;
  const rowH = (eh - gap * (rows - 1) - 16) / rows;

  const bars = [
    { name: '动能', val: ke, color: '#5d8fe8', text: ke.toFixed(4) + ' J' },
    { name: '势能', val: pe, color: '#f0a35e', text: pe.toFixed(4) + ' J' },
    { name: '总能量', val: tot, color: '#9beaff', text: tot.toFixed(4) + ' J' }
  ];

  energyCtx.font = '11px sans-serif';
  energyCtx.textBaseline = 'middle';

  bars.forEach((b, i) => {
    const y = 7 + i * (rowH + gap);
    const frac = Math.min(1, b.val / ref);

    energyCtx.fillStyle = 'rgba(150, 160, 190, 0.12)';
    energyCtx.fillRect(barX, y + 2, barW, rowH - 4);

    energyCtx.fillStyle = '#8e99b8';
    energyCtx.textAlign = 'left';
    energyCtx.fillText(b.name, 4, y + rowH / 2 - 1);
    energyCtx.textAlign = 'right';
    energyCtx.fillText(b.text, barX + barW, y + rowH / 2 - 1);

    energyCtx.fillStyle = b.color;
    energyCtx.fillRect(barX, y + 4, barW * frac, rowH - 8);

    energyCtx.strokeStyle = 'rgba(120, 200, 255, 0.5)';
    energyCtx.lineWidth = 1;
    energyCtx.beginPath();
    energyCtx.moveTo(barX + barW, y - 2);
    energyCtx.lineTo(barX + barW, y + rowH + 2);
    energyCtx.stroke();
  });

  energyCtx.textAlign = 'center';
  energyCtx.fillStyle = 'rgba(142, 153, 184, 0.75)';
  energyCtx.fillText('参考:初始势能 ' + ref.toFixed(4) + ' J', ew / 2, eh - 9);
}

function frame(time) {
  if (lastTime === null) {
    lastTime = time;
  }
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  dt = Math.min(dt, 0.033);
  updatePivot();
  step(dt);
  phasePoints.push({ th: angle, om: angularVelocity });
  if (phasePoints.length > 2600) {
    phasePoints.splice(0, phasePoints.length - 2600);
  }
  draw();
  drawPhase();
  drawEnergy();
  requestAnimationFrame(frame);
}

lenSlider.addEventListener('input', () => {
  LENGTH = Number(lenSlider.value);
  lenVal.textContent = LENGTH + ' px';
  resetPhase();
  persist();
});

gSlider.addEventListener('input', () => {
  GRAVITY = Number(gSlider.value);
  gVal.textContent = Number(GRAVITY.toFixed(2)) + ' m/s²';
  resetPhase();
  syncSceneUI();
  persist();
});

dampSlider.addEventListener('input', () => {
  DAMPING = Number(dampSlider.value);
  dampVal.textContent = DAMPING.toFixed(3);
  persist();
});

function currentPlanetName() {
  const match = PRESETS.find(p => Math.abs(p.g - GRAVITY) < 0.005);
  return match ? match.name : '自定义';
}

function syncSceneUI() {
  sceneBtns.forEach(btn => {
    btn.classList.toggle('active', Math.abs(Number(btn.dataset.g) - GRAVITY) < 0.005);
  });
  sceneVal.textContent = currentPlanetName();
}

function persist() {
  try {
    const state = { length: LENGTH, gravity: GRAVITY, damping: DAMPING, planet: currentPlanetName() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.length === 'number' && s.length >= 100 && s.length <= 350) {
      LENGTH = s.length;
      lenSlider.value = LENGTH;
      lenVal.textContent = LENGTH + ' px';
    }
    if (typeof s.gravity === 'number' && s.gravity >= 1 && s.gravity <= 25) {
      GRAVITY = s.gravity;
      gSlider.value = GRAVITY;
      gVal.textContent = Number(GRAVITY.toFixed(2)) + ' m/s²';
    }
    if (typeof s.damping === 'number' && s.damping >= 0 && s.damping <= 0.01) {
      DAMPING = s.damping;
      dampSlider.value = DAMPING;
      dampVal.textContent = DAMPING.toFixed(3);
    }
  } catch (e) {}
  syncSceneUI();
  resetPhase();
}

sceneBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    GRAVITY = Number(btn.dataset.g);
    gSlider.value = GRAVITY;
    gVal.textContent = Number(GRAVITY.toFixed(2)) + ' m/s²';
    resetPhase();
    syncSceneUI();
    persist();
  });
});

resetBtn.addEventListener('click', () => {
  angle = INITIAL_ANGLE;
  angularVelocity = 0;
  resetPhase();
});

window.addEventListener('resize', resize);
resize();
load();
requestAnimationFrame(frame);
</script>
</body>
</html>
